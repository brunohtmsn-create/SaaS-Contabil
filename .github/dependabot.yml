version: 2

updates:
  # Root workspace dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    groups:
      typescript-ecosystem:
        patterns:
          - typescript
          - '@types/*'
          - '@typescript-eslint/*'
          - prettier
          - eslint
      testing:
        patterns:
          - vitest
          - '@vitest/*'

  # packages/shared
  - package-ecosystem: npm
    directory: /packages/shared
