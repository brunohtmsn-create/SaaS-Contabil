version: 2

# Regra global: ignorar bumps de versão major em todos os ecossistemas.
# Atualizações major têm breaking changes e precisam de migração manual.

updates:
  # Root workspace dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      typescript-ecosystem:
        patterns:
          - typescript
          - '@types/*'
          - '@typescript-eslint/*'
          - prettier
          - eslint
      testing:
        patterns:
          - vitest
          - '@vitest/*'

