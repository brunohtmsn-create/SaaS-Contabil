name: Security Scan

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  PNPM_VERSION: 9

jobs:
  audit:
    name: pnpm audit — high severity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (report-only, high+)
        # Este é um SCAN AGENDADO semanal (não roda em push/PR), logo não é um
        # gate de merge. Um scan agendado que dá hard-fail só gera ruído vermelho
        # no PR conforme a base de advisories da npm avança semanalmente — sempre
        # surgem novas CVEs transitivas (dev tooling, internals de framework).
        # Portanto: REPORT-ONLY. Roda, imprime tudo, gera resumo e warnings bem
        # visíveis, mas NUNCA bloqueia. A remediação real (upgrade de deps) é
        # dívida de hardening pré-produção — ver docs/CHANGELOG.md e STATUS.md.
        run: |
          set +e
          echo "=== pnpm audit --audit-level=high (scan agendado, report-only) ==="

          attempt=1
          max=3
          output=""
          code=0
          while [ "$attempt" -le "$max" ]; do
            output=$(pnpm audit --audit-level=high 2>&1)
            code=$?

            # Erro de tooling/registry (não é vulnerabilidade): resposta gzip mal
            # decodificada pelo pnpm, timeout, reset de conexão etc. Bug conhecido do
            # `pnpm audit` ao dar JSON.parse na resposta do registry → vale retry.
            if [ "$code" -ne 0 ] && echo "$output" | grep -qiE "is not valid JSON|Unexpected token|ECONNRESET|ETIMEDOUT|ENOTFOUND|socket hang up|request to .* failed|EAI_AGAIN|ERR_INVALID"; then
              echo "Tentativa $attempt/$max: erro de rede/registry no pnpm audit — repetindo..."
              attempt=$((attempt + 1))
              sleep $((attempt * 5))
              continue
            fi
            break
          done

          echo "$output"

          resumo=$(echo "$output" | grep -iE "vulnerabilities found|^Severity:" || true)
          {
            echo "## pnpm audit — scan agendado (report-only)"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "✅ Nenhuma vulnerabilidade high/critical acionável."
            else
              echo "⚠️ Vulnerabilidades encontradas — **não bloqueia** (dívida de hardening pré-produção):"
              echo ""
              echo '```'
              echo "${resumo:-ver log do job}"
              echo '```'
              echo ""
              echo "Remediar via upgrade de dependência antes de produção. Ver \`pnpm.auditConfig\` no package.json e docs/CHANGELOG.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            echo "::warning::pnpm audit encontrou vulnerabilidades (report-only, não bloqueia). Resolver via upgrade no hardening pré-produção."
          fi

          # Scan agendado é REPORT-ONLY: nunca bloqueia o pipeline.
          exit 0

  env-gitignore-check:
    name: Verify .env is in .gitignore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .env entries in .gitignore
        run: |
          echo "=== Checking .gitignore covers .env files ==="

          MISSING=0

          check_entry() {
            local pattern="$1"
            if grep -qF "$pattern" .gitignore; then
              echo "  [OK] '$pattern' is in .gitignore"
            else
              echo "  [FAIL] '$pattern' is NOT in .gitignore"
              MISSING=$((MISSING + 1))
            fi
          }

          check_entry ".env"
          check_entry ".env.local"

          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING required .gitignore entries are missing."
            echo "Add them to .gitignore to prevent accidental secret leaks."
            exit 1
          fi

          echo ""
          echo "All required .env patterns are covered by .gitignore."

  secret-scan:
    name: Hardcoded secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets in TypeScript sources
        run: |
          echo "=== Scanning for hardcoded secrets in *.ts sources ==="

          FOUND=0

          # Patterns to detect: GitHub PATs, AWS access keys, and password/key literals
          PATTERNS='ghp_[0-9A-Za-z]\{36\}\|AKIA[0-9A-Z]\{16\}\|password\s*=\s*["'"'"'][^"'"'"']\+["'"'"']'

          for app_dir in apps/api apps/worker apps/dashboard; do
            src_dir="$app_dir/src"
            if [ ! -d "$src_dir" ]; then
              echo "  [SKIP] $src_dir does not exist"
              continue
            fi

            echo "  Scanning $src_dir ..."
            matches=$(grep -rn "$PATTERNS" --include="*.ts" "$src_dir" 2>/dev/null || true)

            if [ -n "$matches" ]; then
              echo ""
              echo "  [FAIL] Potential secrets found in $src_dir:"
              echo "$matches"
              FOUND=$((FOUND + 1))
            else
              echo "  [OK] No secrets detected in $src_dir"
            fi
          done

          # Also scan packages
          for pkg_dir in packages/*/src; do
            if [ ! -d "$pkg_dir" ]; then
              continue
            fi

            echo "  Scanning $pkg_dir ..."
            matches=$(grep -rn "$PATTERNS" --include="*.ts" "$pkg_dir" 2>/dev/null || true)

            if [ -n "$matches" ]; then
              echo ""
              echo "  [FAIL] Potential secrets found in $pkg_dir:"
              echo "$matches"
              FOUND=$((FOUND + 1))
            else
              echo "  [OK] No secrets detected in $pkg_dir"
            fi
          done

          echo ""
          if [ "$FOUND" -gt 0 ]; then
            echo "ERROR: Potential hardcoded secrets found in $FOUND location(s)."
            echo "Remove secrets from source code and use environment variables instead."
            exit 1
          fi

          echo "Secret scan completed — no hardcoded secrets detected."
