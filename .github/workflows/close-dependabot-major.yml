name: Fechar PRs Dependabot — Major Version

on:
  pull_request:
    types: [opened, reopened]

jobs:
  close-major:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Detectar e fechar bump de versão major
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Detecta padrão "from X.y.z to Z.a.b" onde Z > X (major bump)
            const match = title.match(/from (\d+)\.\d+[\.\d]* to (\d+)\.\d+/);
            if (match) {
              const fromMajor = parseInt(match[1], 10);
              const toMajor   = parseInt(match[2], 10);
              if (toMajor > fromMajor) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  state: 'closed',
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: `🔒 PR fechado automaticamente — bump de versão **major** (${match[1]} → ${match[2]}) requer migração manual. Atualize o \`dependabot.yml\` ou abra uma issue para planejar a atualização.`,
                });
                core.notice(`PR #${context.payload.pull_request.number} fechado (major bump ${match[1]}→${match[2]})`);
              }
            }
